		name = "TheanOS",
		notes = "Hardens the EEPROM stub before anyone flashes it. Component lookups now go through a guarded helper, so a missing GPU or screen can no longer throw out of the bootloader script and strand the machine on a firmware error screen, which is the failure that bricked 1.7.0. Loading a file captures both pcall return values so the loaded chunk is not silently dropped, and the result is type-checked before it is run. No functional change to booting.",
