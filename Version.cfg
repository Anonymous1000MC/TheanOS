	channel = "stable",
	name = "TheanOS",
	notes = [[Modernized classic BIOS firmware.

TheanOS-style boot firmware with POST, welcome menu, and tabbed pages:
System information, Boot or repair (disk list + service actions), and BIOS
settings. Applies the modern color palette (near-black background,
warm off-white text, hazard orange accents, acid green status) to the
classic BIOS layout.

All component calls guarded; never hands nil to EEPROM; works on stock
OpenComputers / Lua 5.3. Beep and shutdown calls are guarded so headless
machines are never bricked.]],
