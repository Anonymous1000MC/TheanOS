	name = "TheanOS",
	notes = "Reworks the bootloader menu's appearance and depth. The main menu now has grouped sections, a full-width selection bar instead of recoloured text, a filled title bar with a rule under it, a right-hand column of live values, divider rows and a key-hint footer. It doubles as a status screen, showing disk count, space used of total, and memory without entering a submenu. Diagnostics is now a real report with Storage, Hardware and Self test groups plus per-line values, and About explains how the eeprom stub and the on-disk menu relate. The disk list is factored out of its menu entry so it can be reached from more than one place, and it gained a percentage column. Built on the original proven bootloader; no new API calls beyond the already-guarded computer.totalMemory.",
