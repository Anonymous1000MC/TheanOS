{
	version = "1.7.4",
	released = "2026-10-04",
	channel = "stable",
	name = "TheanOS",
	notes = "Rebuilds the bootloader menu on top of the original bootloader instead of the rewrite. The old EFI is the version that is proven to work on real hardware; the rewrite kept failing because it used calls the OpenComputers boot environment does not provide, namely unicode.wlen and mathCeil. This restores the original source and adds to it rather than replacing it: Continue boot, Boot from device with per-disk size and usage, Diagnostics, Maintenance including clear boot device and restore bootloader from disk, and About, alongside the original Disk utility, System recovery and URL boot. The only new API call is computer.totalMemory, wrapped in pcall with a fallback. Fixes two crashes the new tests caught immediately, an unbound eeprom method and a mathCeil call.",
}
