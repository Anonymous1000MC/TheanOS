	notes = "Text rendering is faster: drawText detects ASCII strings with a single scan and skips the per-character Unicode calls, which cuts the cost of a full screen repaint by roughly a third. Layout and container drawing no longer repeat table lookups for every child on every frame, and column sizes are computed once instead of once per grid row. Non-ASCII text is unaffected apart from a single extra scan. Regression tests for both changes are included under Tools/tests.",
