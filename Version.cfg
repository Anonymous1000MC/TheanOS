{
	version = "1.7.1",
	released = "2026-10-04",
	channel = "stable",
	name = "TheanOS",
	notes = "Fixes a bootloader regression from 1.7.0 that could leave a machine unable to boot with 'expected string, got nil'. The Flash BIOS action wrote the bootloader but never restored the boot address, and eeprom.set() clears it, so the firmware had no valid boot device. Flash BIOS now reads the label and boot address before writing, restores both afterwards, and reads the bootloader back to verify it before reporting success. The EEPROM stub is now read-only with respect to its own storage, since 1.7.0 had it rewriting the EEPROM it was executing from; the installer and the Flash action own the boot address. setData is never given nil anywhere, because nil is what the firmware rejects. Adds EFI/Recover.lua, a standalone recovery script that rewrites and then verifies the EEPROM, and a 'Restore bootloader from disk' action in the bootloader's Maintenance menu.",
}
