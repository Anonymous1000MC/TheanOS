{
	version = "1.7.0",
	released = "2026-10-04",
	channel = "stable",
	name = "TheanOS",
	notes = "New bootloader. EEPROM now holds only a small stub that loads the real bootloader from disk, so the bootloader is no longer size-limited and a system update replaces it without reflashing. Adds a Boot menu (choose device, continue, reboot), Disk utility (per-device info, set boot device, rename volume, erase), Diagnostics (memory, graphics, EEPROM, component inventory, self test, energy), Maintenance (clear boot device, reset bootloader, boot order), Tools (boot from URL, memory test) and an About screen. Settings -> System update gains a Flash BIOS action that writes the stub and reports if the EEPROM is too small. Holding Alt at boot still opens the menu, and Escape works too.",
}
