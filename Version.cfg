{
	version = "1.6.5",
	released = "2026-10-04",
	channel = "stable",
	name = "TheanOS",
	notes = "Fixes the Monitor window being cut off. Every child goes into one layout cell and that cell stacks them vertically, so the window needs to be as tall as the sum of its content: it was 22 rows against about 30 rows of content, so the bottom was clipped away. The window is now sized from a declared content height and is wider, so long key and value pairs no longer run together. The in-window icon was removed, because in a single stacked cell it cannot sit beside the title and was quietly adding rows. Adds a test that re-adds the content height up from the source and fails if it ever exceeds the window again.",
}
