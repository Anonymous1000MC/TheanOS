	name = "TheanOS",
	notes = "Fixes the Monitor window still losing its top and bottom rows. MineOS puts a spacing row between every pair of children stacked in a layout cell, which the previous fix did not account for: the content needed 13 more rows than estimated, and because a layout centres its content, the overflow pushed the heading and the Storage rows outside the window instead of being cleanly clipped. The window is now 54x40, sized from the child count, the height sum and the spacing. The layout test now loads Monitor against the real GUI library and measures where every child lands, rather than counting children in the source text, which is what produced the wrong estimate.",
