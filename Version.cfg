{
	version = "1.9.1",
	released = "2026-11-14",
	channel = "stable",
	name = "TheanOS",
	notes = [[Modern UEFI-style firmware overhaul.

Redesigned boot firmware with a graphical startup screen, animated progress,
hardware detection, boot device selection with priority configuration, system
and EEPROM information, filesystem detection, recovery mode, diagnostics, boot
error logs, firmware settings, safe reboot/shutdown and a text fallback when
graphics are unavailable.

Also hardens OS boot resilience: missing EEPROM data, missing boot filesystem,
and unavailable GPU no longer crash into a blue kernel-panic screen; the machine
degrades gracefully to a plain message and returns to the firmware.

Fixes:
- BIOS screen now updates immediately when switching tabs (no F5 required).
- Page 1 auto-refreshes live uptime, memory and disk stats every 0.5s.
- Installer sleep calls hardened so pauses never crash when computer.sleep is unavailable.

Adds Libraries/Config.lua, a centralized persisted configuration store shipped
with installed systems.]],
}
