{
	version = "1.6.3",
	released = "2026-10-04",
	channel = "stable",
	name = "TheanOS",
	notes = "Fixes the Monitor crash and out-of-memory panic. Its charts were passing two things GUI.chart cannot accept: a flat array of numbers instead of {x, y} points, and a y-axis interval of 0. GUI.chart uses that interval as a loop-step multiplier, so a step of zero never advances the loop, which ran forever and allocated until the machine ran out of memory. Both charts are now correct. Note that 1.6.1 and 1.6.2 were both broken in this way and the earlier memory diagnosis was wrong. Adds tests that drive the real chart drawing code with Monitor's real arguments.",
}