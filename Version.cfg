{
	version = "1.9.9",
	released = "2026-11-14",
	channel = "stable",
	name = "TheanOS",
	notes = [[Modernized classic BIOS UI (your logic preserved).

Applies the modern color palette to the classic TheanOS BIOS:
near-black background (0x0A0C0E), dark charcoal panels (0x12161C),
warm off-white text (0xE8E4D8), hazard orange accents (0xE89C3D),
acid green status (0x9BE860). All panel borders, title bars, tab
highlights, and informational text updated. Box-drawing characters
and layout preserved exactly.

Fixes:
- Blue screen "expected string, got Long" in HiMenu caused by set()
  and fill() wrapper functions passing color values directly to
  gpu.set()/gpu.fill(), which expect only coordinates and text/char.
  set() and fill() now detect (number, string) color+text pairs and
  call setForeground()/setBackground() before the gpu call.

All BIOS logic unchanged from your working version: key handling
(F12/key 88 on key_up), POST(), all menu navigation, bootloader
modifier, device service actions, boot priority management.]],
}
