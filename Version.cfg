	name = "TheanOS",
	notes = "Terminal gains pipelines and redirection (|, >, >>, &&, ; and $VAR), persistent history, path tab-completion, ~/.theanrc aliases and environment, a tldr command, and diff/patch. Adds thean-log for crash reports and thean-check to verify the system against the update manifest. The updater now shows release notes and a grouped list of changed files. New Monitor app shows live memory, refresh cost, uptime, mounts and storage usage. Kernel panics are recorded to /Logs/crash.cfg.",
