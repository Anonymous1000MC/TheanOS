{
	version = "1.9.7",
	released = "2026-11-14",
	channel = "stable",
	name = "TheanOS",
	notes = [[Modernized classic BIOS firmware.

TheanOS-style boot firmware with POST, welcome menu, and tabbed pages:
System information, Boot or repair (disk list + service actions), and BIOS
settings. Applies the modern color palette (near-black background,
warm off-white text, hazard orange accents, acid green status) to the
classic BIOS layout.

Fixes:
- BIOS entry: any key press now enters BIOS settings. Previously only
  specific Alt key codes on key_down were accepted, which didn't work
  on all keyboard layouts. Now any key during the 5-second welcome
  screen enters BIOS; waiting 5 seconds boots OpenOS.
- BIOS no longer crashes when POST fails (no GPU/screen). Previously
  HiMenu() ran unconditionally and called setResolution/setBackground
  on a nil gpu, crashing before the BIOS ever drew anything. Now skips
  straight to disk boot without graphics.
- EEPROM access guarded in POST() — no crash when no EEPROM present.
- got() checks GPU max resolution before requesting 74x25, falling back
  to current resolution if unsupported.
- Flash BIOS button no longer crashes silently. All EEPROM component
  calls in the Settings update module are wrapped with pcall guards.
- Installer OpenOS.lua no longer crashes on builds where computer.sleep
  is unavailable: safeSleep() wraps computer.sleep with pcall and falls
  back to a busy-wait via pullSignal.

All component calls guarded; never hands nil to EEPROM; works on stock
OpenComputers / Lua 5.3.]],
}
