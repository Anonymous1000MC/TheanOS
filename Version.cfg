{
	version = "1.7.3",
	released = "2026-10-04",
	channel = "stable",
	name = "TheanOS",
	notes = "Fixes the bootloader menu failing with an unrecoverable error when Alt was held. The menu measured text with unicode.wlen, which the bootloader it replaces never used and which is not guaranteed to exist in the OpenComputers boot environment, so the first draw threw. Width is now plain string length, matching the version known to boot. Also fixed a malformed entry in the About panel that passed nil into the text measuring and took the menu down a second way. Adds a harness that runs the real bootloader under a stubbed boot environment and walks every menu entry, which is what found both faults.",
}
