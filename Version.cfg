	notes = "Fixes Monitor failing to start with 'attempt to call a nil value (global collectgarbage)'. OpenComputers does not provide collectgarbage, so Monitor now reads memory through computer.getMemory(), falling back to computer.totalMemory() and reporting honestly when neither is available. Every memory read is guarded, because the available computer APIs differ between OpenComputers versions. The Monitor test now hides collectgarbage while loading the app, which is the omission that let this reach hardware.",
