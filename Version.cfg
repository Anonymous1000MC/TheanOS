{
	version = "1.8.0",
	released = "2026-10-04",
	channel = "stable",
	name = "TheanOS",
	notes = [[Modern BIOS shell for TheanOS.

Replaces the flat boot menu with a three-page tabbed interface: System information,
Boot or repair, and BIOS settings. Adds a context panel, live memory, uptime and
disk status, a device service view, and F5 refresh / F9 exit.

Also fixes the class of bug that made the previous BIOS builds unusable:
boot-environment globals such as pullSignal and panelX were referenced without
being bound, and the resolution check handed nil to a string length.]],
